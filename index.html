<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horario 1º SMR</title>
    <style>
        .recreo {
            text-align: center;
            background-color: #e0e0e0;
        }
        .redl {
            background-color: #ff6666;
        }
        .mmeq {
            background-color: #85c1e9;
        }
        .fol {
            background-color: #82e0aa;
        }
        .som {
            background-color: #f9e79f;
        }
        .aweb {
            background-color: #f5b041;
        }
        .ing {
            background-color: #bb8fce;
        }
    </style>
</head>
<body>
    <h1>Horario 1º SMR</h1>
    
    <table border="1">
        <thead>
            <tr>
                <th>Hora</th>
                <th>Tiempo de hora</th>
                <th>Lunes</th>
                <th>Martes</th>
                <th>Miércoles</th>
                <th>Jueves</th>
                <th>Viernes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1ª</td>
                <td>8:30 - 9:25</td>
                <td rowspan="3" class="mmeq">MMEQ</td>
                <td class="fol">FOL</td>
                <td rowspan="2" class="som">SOM</td>
                <td class="aweb">AWEB</td>
                <td rowspan="2" class="redl">REDL</td>
            </tr>
            <tr>
                <td>2ª</td>
                <td>9:25 - 10:20</td>
                <td rowspan="2" class="aweb">AWEB</td>
                <td class="aweb">AWEB</td>
            </tr>
            <tr>
                <td>3ª</td>
                <td>10:20 - 11:15</td>
                <td class="fol">FOL</td>
                <td class="redl">REDL</td>
                <td class="mmeq">MMEQ</td>
            </tr>
            <tr>
                <td colspan="7" class="recreo">Recreo (11:15 - 11:45)</td>
            </tr>
            <tr>
                <td>4ª</td>
                <td>11:45 - 12:40</td>
                <td class="ing">ING</td>
                <td rowspan="2" class="mmeq">MMEQ</td>
                <td class="fol">FOL</td>
                <td class="redl">REDL</td>
                <td class="mmeq">MMEQ</td>
            </tr>
            <tr>
                <td>5ª</td>
                <td>12:40 - 13:35</td>
                <td rowspan="2" class="redl">REDL</td>
                <td rowspan="2" class="aweb">AWEB</td>
                <td rowspan="2" class="som">SOM</td>
                <td rowspan="2" class="som">SOM</td>
            </tr>
            <tr>
                <td>6ª</td>
                <td>13:35 - 14:30</td>
                <td class="ing">ING</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
